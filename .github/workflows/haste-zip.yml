name: haste.zip attached

# The AWFY history page (awfy.yml) reads benchmark results from the haste.zip
# linked in each merged PR's description, so require one before merging.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check the PR description links a haste.zip
        env:
          # Passed via env, not ${{ }} in the script, so the body cannot inject shell.
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if ! grep -qE 'https://github\.com/user-attachments/files/[0-9]+/haste\.zip' <<< "$BODY"; then
            echo "::error::Attach the AWFY results as haste.zip to the PR description."
            exit 1
          fi
